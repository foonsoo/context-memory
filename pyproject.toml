[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-memory"
version = "0.6.0"
description = "Local-first, provenance-preserving context memory MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Context Memory contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Database",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["ruff==0.16.1"]
neural = ["sentence-transformers>=3,<6"]

[project.scripts]
context-memory = "context_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_memory"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"

[tool.ruff]
target-version = "py311"
line-length = 79
include = [
  "src/context_memory/__init__.py",
  "src/context_memory/audit_anchor.py",
  "src/context_memory/backup_crypto.py",
  "src/context_memory/contracts.py",
  "src/context_memory/embeddings.py",
  "src/context_memory/hooks.py",
  "src/context_memory/tasks.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
