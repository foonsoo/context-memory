name: Publish distributions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag matching pyproject.toml (for example v0.6.0)
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI after TestPyPI verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify annotated tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git cat-file -t "$RELEASE_TAG" | grep -Fx tag
      - name: Build and verify reproducible distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install build
          epoch=$(git show -s --format=%ct HEAD)
          SOURCE_DATE_EPOCH="$epoch" python -m build --outdir "$RUNNER_TEMP/dist-one"
          SOURCE_DATE_EPOCH="$epoch" python -m build --outdir "$RUNNER_TEMP/dist-two"
          python scripts/verify_release.py --tag "$RELEASE_TAG" \
            --dist-dir "$RUNNER_TEMP/dist-one" \
            --compare-dist-dir "$RUNNER_TEMP/dist-two"
      - name: Verify wheel installation
        run: |
          python -m venv release-test
          release-test/bin/pip install --no-deps "$RUNNER_TEMP"/dist-one/*.whl
          release-test/bin/python tests/installed_e2e.py
          release-test/bin/python tests/registration_e2e.py
          release-test/bin/python tests/upgrade_e2e.py "$RUNNER_TEMP"/dist-one/*.whl
          release-test/bin/python tests/uninstall_e2e.py
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/dist-one/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: ${{ runner.temp }}/dist-one/*
          if-no-files-found: error
          retention-days: 7

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install exact TestPyPI release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          python -m pip install --index-url https://test.pypi.org/simple/ \
            --no-deps "context-memory-mcp==$version"
          context-memory --help

  pypi:
    if: ${{ inputs.publish_pypi }}
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
