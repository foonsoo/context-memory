name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install development checks
        run: python -m pip install '.[dev]'
      - name: Check PEP 8 lint rules
        run: ruff check .
      - name: Check deterministic formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src benchmarks/run_benchmark.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel, empty workspace, and restart persistence
        run: |
          python -m venv wheel-test
          wheel-test/bin/pip install --no-deps dist/*.whl
          wheel-test/bin/python tests/installed_e2e.py
      - name: Verify official MCP SDK and multi-client interoperability
        run: |
          wheel-test/bin/pip install 'mcp==2.0.0'
          wheel-test/bin/python tests/official_sdk_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: context-memory-wheel
          path: dist/*.whl
